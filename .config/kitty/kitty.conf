# kitty.conf
# ----------
# Theme
include                     ayu-dark.conf

# Fonts
font_family                 FiraCode Nerd Font
bold_font                   auto
italic_font                 auto
bold_italic_font            auto
font_size                   11.0
modify_font                 cell_height 115%
font_features               FiraCodeNF-Reg +ss02 +ss03 +ss05 +cv02 +zero
font_features               FiraCodeNF-Bold +ss02 +ss03 +ss05 +cv02 +zero

disable_ligatures           never

# Cursor
cursor_shape                beam
cursor_trail                3
cursor_trail_decay          0.1 0.4
cursor_blink_interval       0.5 ease-in-out

# Tabs
tab_bar_edge                top
tab_bar_style               powerline
tab_powerline_style         slanted
tab_bar_align               left
tab_bar_min_tabs            2
tab_switch_strategy         previous
tab_title_template          "{fmt.fg.red}{bell_symbol}{activity_symbol}{fmt.fg.tab}{index}  {title}"
active_tab_font_style       bold
tab_bar_margin_width        0.0
tab_bar_margin_height       0.0 4.0
bell_on_tab                 yes
tab_activity_symbol         " *"

# Window
hide_window_decorations     yes
window_padding_width        8 14
window_border_width         1pt
inactive_text_alpha         0.75
background_opacity          0.80
dynamic_background_opacity  yes
background_blur             1
remember_window_size        yes
initial_window_width        120c
initial_window_height       36c

# Scrollback
scrollback_lines            10000
mouse_hide_wait             0.5
sync_to_monitor             yes

# Clipboard
copy_on_select              yes
strip_trailing_spaces       smart
clipboard_control           write-clipboard write-primary

# Misc
visual_bell_duration        0.0
enable_audio_bell           no
window_alert_on_bell        yes
editor                      nvim
